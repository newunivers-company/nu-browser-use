    robots_verdict: unknown
    official_status: verified
    official_evidence: appstore_seller_url
    consumer_or_b2b: consumer
    collect: true
    notes: >-
      Nuxt SSR, no catalog API, sitemap 404. Payload is PLAINTEXT, so an HTTP
      collector would be trivial — we deliberately do not write one. robots.txt
      has no `User-agent: *` group at all: it allowlists Googlebot / Bingbot /
      Yandex / Yeti and denies python-requests / Scrapy / wget / HTTrack /
      crawler4j / libwww-perl by name. No rule formally binds us (stdlib
      can_fetch('*') is True) but the intent is unmistakable, and the server
      agrees — default aiohttp gets `400 Too many headers received` while a
      browser is served. Line drawn is library-vs-browser, so flextv_collect.py
      renders. COVERAGE GAP: /dramas/all-dramas has anchor-less JS cards, so
      enumeration is home + genre pages only.
