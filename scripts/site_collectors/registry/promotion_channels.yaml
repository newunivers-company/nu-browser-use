# Short-drama promotion-channel registry.
#
# Data, not code. Collectors read this file; nothing hardcodes URLs.
#
# access_tier decides whether a channel is fetched at all:
#   T0  keyless HTTP, robots-clean, structured data available   -> collect
#   T1  reachable but JS-rendered / no sitemap -> needs CDP      -> collect
#   T2  authwall or robots-prohibited                            -> DO NOT FETCH
#
# T2 rows stay in the registry on purpose. We record that the channel exists
# and who owns it; we never request it. `collect: false` is enforced by
# promo_registry_verify.py, which skips those URLs entirely.
#
# official_status is only `verified` when a first-party source states the URL.
# The evidence must be named — no inference from handle spelling.
#
# Verified 2026-08-14 (HTTP + robots.txt sweep; App Store Lookup API).

schema_version: 1
verified_at: '2026-08-14'

