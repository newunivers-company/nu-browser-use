default_language_version:
  python: python3.11

repos:
  - repo: local
    hooks:
      - id: configuration-defaults
        name: verify generated configuration defaults
        entry: uv run --locked --no-sync python scripts/generate_configuration_defaults.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|\.python-version|AGENTS\.md|README\.md|browser_use/agent/service\.py|browser_use/browser/(profile|extensions)\.py|docs/configuration-defaults\.md|scripts/generate_configuration_defaults\.py)$
      - id: release-metadata
        name: verify release and MCP metadata
        entry: uv run --locked --no-sync python scripts/verify_release_metadata.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|\.python-version|server\.json|browser_use/mcp/(manifest\.json|server\.py)|scripts/verify_release_metadata\.py)$

  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell # See pyproject.toml for args
        additional_dependencies:
          - tomli

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

  # - repo: https://github.com/asottile/add-trailing-comma
  #   rev: v3.1.0
  #   hooks:
  #     - id: add-trailing-comma

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
      # see pyproject.toml for more details on ruff config

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
    - id: pyright

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # check for basic syntax errors in python and data files
      - id: check-ast
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      # check for bad files and folders
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
      - id: fix-byte-order-marker
      - id: end-of-file-fixer
      # best practices enforcement
      - id: detect-private-key
      # - id: check-docstring-first
      - id: debug-statements
      - id: forbid-submodules
      - id: check-added-large-files
        args: ["--maxkb=600"]
        exclude: ^uv\.lock$
      # - id: name-tests-test
      #   args: ["--pytest-test-first"]
